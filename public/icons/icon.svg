<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Open book shape -->
  <g transform="translate(256,270)" fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left page -->
    <path d="M-8,-80 C-8,-80 -100,-100 -140,-80 L-140,80 C-100,60 -8,80 -8,80" fill="rgba(255,255,255,0.15)"/>
    <!-- Right page -->
    <path d="M8,-80 C8,-80 100,-100 140,-80 L140,80 C100,60 8,80 8,80" fill="rgba(255,255,255,0.15)"/>
    <!-- Spine -->
    <line x1="0" y1="-85" x2="0" y2="85"/>
    <!-- Text lines on left page -->
    <line x1="-120" y1="-50" x2="-30" y2="-50" stroke-width="8" opacity="0.5"/>
    <line x1="-115" y1="-25" x2="-35" y2="-25" stroke-width="8" opacity="0.5"/>
    <line x1="-110" y1="0" x2="-40" y2="0" stroke-width="8" opacity="0.5"/>
    <line x1="-105" y1="25" x2="-30" y2="25" stroke-width="8" opacity="0.5"/>
    <!-- Text lines on right page -->
    <line x1="30" y1="-50" x2="120" y2="-50" stroke-width="8" opacity="0.5"/>
    <line x1="35" y1="-25" x2="115" y2="-25" stroke-width="8" opacity="0.5"/>
    <line x1="40" y1="0" x2="110" y2="0" stroke-width="8" opacity="0.5"/>
    <line x1="30" y1="25" x2="105" y2="25" stroke-width="8" opacity="0.5"/>
  </g>
  <!-- ZEN text -->
  <text x="256" y="420" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Inter, -apple-system, sans-serif" font-size="52" font-weight="600" letter-spacing="12">ZEN</text>
</svg>
